<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- 让 Safari / Chrome 等浏览器的地址栏、状态栏与页面底色一致，
         避免移动端半透明地址栏下方透出浏览器白色的情况 -->
    <meta name="theme-color" content="#F7FAF5" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>RIEMer Land</title>
    <meta name="description" content="RIEMer Land 致力于推动跨学科研究与深度学术交流，汇聚来自不同领域的思考者。" />

    <!-- 预加载 Logo，避免首屏闪动 -->
    <link rel="preload" as="image" href="/logo.png" />

    <!--
      预连接字体服务器（并行解析 DNS+TLS，减少字体请求耗时）
      - fonts.loli.net / gstatic.loli.net：Google Fonts 的中科大镜像，国内稳定直连
      - gcore.jsdelivr.net：jsDelivr 的 Gcore 节点（国内直连比主站稳得多）
      - unpkg.com：备用 CDN，异源容错
    -->
    <link rel="preconnect" href="https://fonts.loli.net" />
    <link rel="preconnect" href="https://gstatic.loli.net" crossorigin />
    <link rel="preconnect" href="https://gcore.jsdelivr.net" crossorigin />
    <link rel="dns-prefetch" href="https://unpkg.com" />

    <!--
      预连接 Supabase 源（%VITE_SUPABASE_URL% 由 Vite 在构建时替换为实际项目地址）
      - 无 crossorigin 的一条：预热文章封面 <img> 走的普通连接池
      - 带 crossorigin 的一条：预热 REST 列表接口（fetchPublicRows）走的 CORS 连接池
      首次访问时省下现场 DNS+TLS 握手，封面/数据能更快开始下载。
    -->
    <link rel="preconnect" href="%VITE_SUPABASE_URL%" />
    <link rel="preconnect" href="%VITE_SUPABASE_URL%" crossorigin />

    <!--
      字体加载策略（优化版 2026-04）：
      - 英文衬线：Lora（正文）/ EB Garamond（品牌）/ DM Serif Display（大标题）
        → 走 Google Fonts 中科大镜像 fonts.loli.net（国内直连，不被墙）
      - 中文楷体：LXGW WenKai 霞鹜文楷（项目原始视觉标识，保留手写衬线感）
        → 主源 gcore.jsdelivr.net（Gcore CDN 在国内有边缘节点，比 cdn.jsdelivr.net 稳）
        → 只加载"regular"字重子 CSS（不拉 light/bold/mono，省 5 个 HTTP 请求）
        → preload 这份子 CSS，让浏览器尽早发请求、尽早解析 @font-face
        → 字体本身已按 unicode-range 分 100+ 片，浏览器只下载页面用到的那几片
      - display=swap：字体未到位时先用 fallback 渲染，到位后立即切换
      - 配合下方 size-adjust 校准 "XXX Fallback"，切换几乎无字号/行高跳变
    -->

    <!-- Google Fonts 英文字体（走中科大镜像，国内稳）
         非阻塞加载：先用系统 fallback 首屏渲染，字体 CSS 到了再切换。 -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.loli.net/css2?family=DM+Serif+Display&family=EB+Garamond:wght@400;500;600;700&family=Lora:wght@400;500;600;700&display=swap"
      onload="this.onload=null;this.rel='stylesheet'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.loli.net/css2?family=DM+Serif+Display&family=EB+Garamond:wght@400;500;600;700&family=Lora:wght@400;500;600;700&display=swap"
      />
    </noscript>

    <!--
      LXGW WenKai 霞鹜文楷（全局中文字体，项目原始视觉）
      主源：gcore.jsdelivr.net（jsDelivr 的 Gcore 国内加速节点）

      包结构说明：style.css 是聚合入口，内部通过 @import 引入 6 个子 CSS（常规/细/粗 × 普通/等宽），
      每个子 CSS 又按 unicode-range 分 116 个 woff2 分片。浏览器会根据页面实际出现的字符
      **只下载用到的 2~5 个分片**（每片约 30~80KB），不是一次性 6MB。
    -->

    <!-- 字体 CSS 也非阻塞加载：移动端先显示页面，再异步切换到 WenKai。 -->
    <link
      rel="preload"
      as="style"
      href="https://gcore.jsdelivr.net/npm/lxgw-wenkai-webfont@1.7.0/lxgwwenkai-regular.css"
      onload="this.onload=null;this.rel='stylesheet'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://gcore.jsdelivr.net/npm/lxgw-wenkai-webfont@1.7.0/lxgwwenkai-regular.css"
      />
    </noscript>

    <!--
      Adjusted fallback @font-face：
      在 Web 字体到位前，body 用 "Lora Fallback" 渲染，它实际是系统字体
      但经过 size-adjust 等参数"校准"到与 Lora 相似的视觉尺寸。
      这样 Lora 一旦到位，字号、基线、行高几乎不变，切换无感。

      度量数据参考 Google Fonts 提供的 fallback matching（
      https://fonts.google.com/knowledge/using_type/adjusting_fallback_fonts）
    -->
    <style>
      /* Lora（正文） —— fallback 用系统衬线 */
      @font-face {
        font-family: 'Lora Fallback';
        src: local('Georgia'), local('Times New Roman'), local('Times');
        size-adjust: 106%;
        ascent-override: 92%;
        descent-override: 24%;
        line-gap-override: 0%;
      }
      /* EB Garamond（品牌） —— fallback 用系统衬线 */
      @font-face {
        font-family: 'EB Garamond Fallback';
        src: local('Georgia'), local('Times New Roman'), local('Times');
        size-adjust: 98%;
        ascent-override: 100%;
        descent-override: 28%;
        line-gap-override: 0%;
      }
      /* DM Serif Display（大标题） —— fallback 用系统衬线 */
      @font-face {
        font-family: 'DM Serif Display Fallback';
        src: local('Georgia'), local('Times New Roman'), local('Times');
        size-adjust: 108%;
        ascent-override: 96%;
        descent-override: 28%;
        line-gap-override: 0%;
      }
    </style>

    <!-- Google Analytics (GA4)
         只有替换成真实 Measurement ID 后才加载，避免占位 ID 在移动端产生无效外链请求。 -->
    <script>
      (function () {
        var GA_ID = 'G-XXXXXXXXXX';
        if (!GA_ID || GA_ID === 'G-XXXXXXXXXX') return;
        window.dataLayer = window.dataLayer || [];
        window.gtag = function gtag(){dataLayer.push(arguments);}
        var script = document.createElement('script');
        script.async = true;
        script.src = 'https://www.googletagmanager.com/gtag/js?id=' + encodeURIComponent(GA_ID);
        document.head.appendChild(script);
        window.gtag('js', new Date());
        window.gtag('config', GA_ID, { send_page_view: false });
      })();
    </script>
  </head>
  <body>
    <!--
      首屏骨架屏（App Shell Skeleton）
      纯 HTML/CSS，放在 #root 内部：在 JS bundle 还没下载/执行、React 尚未挂载前就能显示，
      避免移动端慢网络下首页长时间空白。React 一旦 mount 会自动用真实内容替换掉这些占位节点。
    -->
    <style>
      @keyframes app-skeleton-shimmer {
        0% { background-position: -468px 0; }
        100% { background-position: 468px 0; }
      }
      #app-skeleton {
        min-height: 100vh;
        background: #F7FAF5;
        padding: 0;
        /* React 挂载后此节点被移除；这里只在首屏短暂出现 */
      }
      #app-skeleton .sk-container {
        max-width: 1120px;
        margin: 0 auto;
        padding: 0 20px;
      }
      #app-skeleton .sk-hero {
        padding: 56px 0 40px;
        text-align: center;
      }
      #app-skeleton .sk-block {
        background: #e9efe6;
        background-image: linear-gradient(90deg, #e9efe6 0px, #f3f7f1 40px, #e9efe6 80px);
        background-size: 600px 100%;
        border-radius: 10px;
        animation: app-skeleton-shimmer 1.4s ease-in-out infinite;
      }
      #app-skeleton .sk-title { height: 38px; width: 60%; margin: 0 auto 16px; border-radius: 12px; }
      #app-skeleton .sk-subtitle { height: 18px; width: 80%; margin: 0 auto; border-radius: 8px; }
      #app-skeleton .sk-stats {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 16px;
        margin: 8px 0 40px;
      }
      #app-skeleton .sk-stat { height: 84px; border-radius: 12px; }
      #app-skeleton .sk-section-title { height: 26px; width: 140px; margin: 24px 0 20px; border-radius: 8px; }
      #app-skeleton .sk-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 20px;
      }
      #app-skeleton .sk-card { height: 260px; border-radius: 14px; }
      @media (max-width: 768px) {
        #app-skeleton .sk-hero { padding: 40px 0 28px; }
        #app-skeleton .sk-title { height: 30px; width: 78%; }
        #app-skeleton .sk-stats { grid-template-columns: repeat(2, 1fr); gap: 12px; }
        #app-skeleton .sk-grid { grid-template-columns: 1fr; gap: 16px; }
        #app-skeleton .sk-card { height: 150px; }
      }
    </style>
    <div id="root">
      <div id="app-skeleton" aria-hidden="true">
        <div class="sk-container">
          <div class="sk-hero">
            <div class="sk-block sk-title"></div>
            <div class="sk-block sk-subtitle"></div>
          </div>
          <div class="sk-stats">
            <div class="sk-block sk-stat"></div>
            <div class="sk-block sk-stat"></div>
            <div class="sk-block sk-stat"></div>
            <div class="sk-block sk-stat"></div>
          </div>
          <div class="sk-block sk-section-title"></div>
          <div class="sk-grid">
            <div class="sk-block sk-card"></div>
            <div class="sk-block sk-card"></div>
            <div class="sk-block sk-card"></div>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
