<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RIEMer Land</title>
    <meta name="description" content="RIEMer Land 致力于推动跨学科研究与深度学术交流，汇聚来自不同领域的思考者。" />

    <!-- 预加载 Logo，避免首屏闪动 -->
    <link rel="preload" as="image" href="/logo.png" />

    <!-- 预连接字体服务器（并行解析 DNS+TLS，减少字体请求耗时） -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />

    <!--
      字体加载策略：
      - display=swap：字体未到位时先用校准过的 fallback 渲染，字体到位后立即切换到
        Web 字体（Lora / EB Garamond / DM Serif Display）。相比 optional，能确保
        用户最终一定看到设计字体，不会因为网络慢 100ms 就整页退化到系统字体。
      - 配合下方 size-adjust 校准的 "XXX Fallback" 字体，fallback → Web 字体
        切换时几乎无字号/行高跳变，体验平滑。
    -->

    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=EB+Garamond:wght@400;500;600;700&family=Lora:wght@400;500;600;700&display=swap"
    />

    <!--
      Adjusted fallback @font-face：
      在 Web 字体到位前，body 用 "Lora Fallback" 渲染，它实际是系统字体
      但经过 size-adjust 等参数"校准"到与 Lora 相似的视觉尺寸。
      这样 Lora 一旦到位，字号、基线、行高几乎不变，切换无感。

      度量数据参考 Google Fonts 提供的 fallback matching（
      https://fonts.google.com/knowledge/using_type/adjusting_fallback_fonts）
    -->
    <style>
      /* Lora（正文） —— fallback 用系统衬线 */
      @font-face {
        font-family: 'Lora Fallback';
        src: local('Georgia'), local('Times New Roman'), local('Times');
        size-adjust: 106%;
        ascent-override: 92%;
        descent-override: 24%;
        line-gap-override: 0%;
      }
      /* EB Garamond（品牌） —— fallback 用系统衬线 */
      @font-face {
        font-family: 'EB Garamond Fallback';
        src: local('Georgia'), local('Times New Roman'), local('Times');
        size-adjust: 98%;
        ascent-override: 100%;
        descent-override: 28%;
        line-gap-override: 0%;
      }
      /* DM Serif Display（大标题） —— fallback 用系统衬线 */
      @font-face {
        font-family: 'DM Serif Display Fallback';
        src: local('Georgia'), local('Times New Roman'), local('Times');
        size-adjust: 108%;
        ascent-override: 96%;
        descent-override: 28%;
        line-gap-override: 0%;
      }
    </style>

    <!--
      LXGW WenKai 不再默认加载为全局中文字体（会产生强烈的"楷体切换"视觉落差）。
      如需在特定标题/引用处使用，请在对应 CSS 里按需引入。
    -->

    <!-- Google Analytics (GA4) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-XXXXXXXXXX"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-XXXXXXXXXX', { send_page_view: false });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
