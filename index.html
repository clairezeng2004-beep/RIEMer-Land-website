<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RIEMer Land</title>
    <meta name="description" content="RIEMer Land 致力于推动跨学科研究与深度学术交流，汇聚来自不同领域的思考者。" />

    <!-- 预加载 Logo，避免首屏闪动 -->
    <link rel="preload" as="image" href="/logo.png" />

    <!-- 预连接字体服务器（并行解析 DNS+TLS，减少字体请求耗时） -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />

    <!--
      字体加载策略（避免手机端首次访问"文字跳变"的割裂感）：
      1. 英文字体使用 display=optional：浏览器只等 ~100ms；超时本次直接用 fallback
         渲染，不再中途切换，下次访问（命中缓存）自然生效最终字体。
      2. 英文字重精简，只加载实际用到的 400/500/600/700。
      3. 中文 LXGW WenKai 文件较大，在慢网络下最易产生"跳字"感。
         用 preload+onload 异步加载，不阻塞首屏；未到位时 fallback 到系统中文字体
         （PingFang SC / Noto Sans SC / 微软雅黑）—— 这些字体在移动端原生存在，
         用户首帧看到的就是美观、干净的中文，而不是衬线宋体。
    -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=EB+Garamond:wght@400;500;600;700&family=Lora:wght@400;500;600;700&display=optional"
    />

    <!-- LXGW WenKai 异步加载：不阻塞首屏，到位后平滑升级 -->
    <link
      rel="preload"
      as="style"
      href="https://cdn.jsdelivr.net/npm/lxgw-wenkai-webfont@1.7.0/style.css"
      onload="this.onload=null;this.rel='stylesheet'"
    />
    <noscript>
      <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lxgw-wenkai-webfont@1.7.0/style.css" />
    </noscript>

    <!-- Google Analytics (GA4) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-XXXXXXXXXX"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-XXXXXXXXXX', { send_page_view: false });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
